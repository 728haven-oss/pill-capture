# iOS 빌드 (App Store / TestFlight) — Windows PC만 있어도 GitHub의 macOS 러너가 대신 빌드합니다.
#  - 시크릿 없이 실행하면: 서명 없는 빌드까지 수행해 프로젝트가 정상인지 검증 (산출물 없음)
#  - 아래 시크릿을 등록하면: 서명 → IPA 내보내기 → App Store Connect(TestFlight)로 업로드
#      IOS_CERT_P12_BASE64     배포 인증서(.p12)를 base64 한 문자열   IOS_CERT_PASSWORD  p12 비밀번호
#      IOS_PROFILE_BASE64      App Store 프로비저닝 프로파일(.mobileprovision) base64  (Bundle ID: kr.pillcapture.app)
#      APPLE_TEAM_ID           팀 ID (예: AB12CD34EF)
#      ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (또는 ASC_KEY_P8_BASE64)   App Store Connect API 키
name: iOS (App Store)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-26   # App Store 업로드는 iOS 26 SDK(Xcode 26+) 필수
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build web (docs/)
        env: { RC_ANDROID_KEY: "${{ secrets.RC_ANDROID_KEY }}", RC_IOS_KEY: "${{ secrets.RC_IOS_KEY }}" }
        run: pip3 install --break-system-packages pillow && python3 tools/build.py
      - name: Capacitor iOS project
        run: |
          npm install
          npm install @capacitor/ios@^6
          npx cap add ios
          npx cap sync ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 알약캡쳐" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 알약캡쳐" $P
          # 카메라/사진 권한 문구 (없으면 심사 거절·촬영 시 크래시)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 알약을 촬영해 개수를 세기 위해 카메라를 사용합니다." $P || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 저장된 알약 사진·영상을 불러와 개수를 세기 위해 사진 보관함에 접근합니다." $P || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 촬영한 사진을 저장하기 위해 사용합니다." $P || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
          # 앱 아이콘 1024
          cp assets/icons/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          python3 -c "from PIL import Image; im=Image.open('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png'); assert im.size==(1024,1024), im.size; print('icon OK', im.size)"
          ls ios/App/App/Assets.xcassets/AppIcon.appiconset/
      - name: Version
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VN="${GITHUB_REF#refs/tags/v}"; else VN="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$VN" >> $GITHUB_OUTPUT
          cd ios/App && xcrun agvtool new-marketing-version "$VN" && xcrun agvtool new-version -all $((GITHUB_RUN_NUMBER + 100))
      - name: Pods
        run: cd ios/App && pod install
      - name: Check signing secrets
        id: s
        run: |
          if [ -n "${{ secrets.IOS_CERT_P12_BASE64 }}" ] && [ -n "${{ secrets.IOS_PROFILE_BASE64 }}" ]; then echo "signed=true" >> $GITHUB_OUTPUT; else echo "signed=false" >> $GITHUB_OUTPUT; fi
      - name: Unsigned build (검증용)
        if: steps.s.outputs.signed == 'false'
        run: |
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -20
          echo "::notice::서명 시크릿이 없어 검증 빌드만 수행했습니다. 시크릿 등록 후 다시 실행하면 TestFlight로 업로드됩니다."
      - name: Import certificate & profile
        if: steps.s.outputs.signed == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROF: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db; KPW=$(uuidgen)
          security create-keychain -p "$KPW" $KC; security set-keychain-settings -lut 21600 $KC; security unlock-keychain -p "$KPW" $KC
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12PW" -A -t cert -f pkcs12 -k $KC
          curl -sSL -o $RUNNER_TEMP/wwdr.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && security import $RUNNER_TEMP/wwdr.cer -k $KC -A || true
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" $KC
          security find-identity -v -p codesigning $KC
          security list-keychain -d user -s $KC
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROF" | base64 --decode > $RUNNER_TEMP/app.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/app.mobileprovision))
          cp $RUNNER_TEMP/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
      - name: Archive & export IPA
        if: steps.s.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            t.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_STYLE"] = "Manual"
              c.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
              c.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              c.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            end
            p.save
          '
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive archive | tail -30
          test -d $RUNNER_TEMP/App.xcarchive
          cat > $RUNNER_TEMP/export.plist <<P
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          <key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>kr.pillcapture.app</key><string>$PROFILE_UUID</string></dict></dict></plist>
          P
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out | tail -5
          ls $RUNNER_TEMP/out
      - name: Upload to TestFlight
        if: steps.s.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "::notice::ASC_KEY_ID 시크릿이 없어 TestFlight 업로드는 건너뜁니다 (IPA는 산출물로 저장됨)."; exit 0; fi
          mkdir -p ~/.appstoreconnect/private_keys
          KEYF=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          python3 - "$KEYF" <<'PY'
          import os, re, sys, base64, textwrap
          raw = os.environ.get("ASC_KEY_P8") or ""
          b64 = os.environ.get("ASC_KEY_P8_BASE64") or ""
          if not raw.strip() and b64.strip():
              raw = base64.b64decode(re.sub(r"\s", "", b64)).decode()
          raw = raw.replace("\r", "").strip().lstrip("﻿")
          m = re.search(r"BEGIN PRIVATE KEY-*(.*?)-*END PRIVATE KEY", raw, re.S)
          body = m.group(1) if m else raw
          body = re.sub(r"\s", "", body)
          if not m:
              try:
                  dec = base64.b64decode(body).decode()
                  m2 = re.search(r"BEGIN PRIVATE KEY-*(.*?)-*END PRIVATE KEY", dec, re.S)
                  if m2: body = re.sub(r"\s", "", m2.group(1))
              except Exception:
                  pass
          try:
              base64.b64decode(body, validate=True)
          except Exception:
              print("::error::ASC_KEY_P8 내용이 올바른 .p8(PEM) 형식이 아닙니다"); sys.exit(1)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem); print("p8 OK")
          PY
          chmod 600 "$KEYF"
          xcrun altool --upload-app -f $RUNNER_TEMP/out/App.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER_ID
      - uses: actions/upload-artifact@v4
        if: always() && steps.s.outputs.signed == 'true'
        with:
          name: pill-capture-ios-${{ steps.v.outputs.name }}
          path: ${{ runner.temp }}/out/*.ipa
