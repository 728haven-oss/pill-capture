# PWA를 GitHub Pages로 배포 (아이폰: Safari → 공유 → 홈 화면에 추가)
#  최초 1회: Settings → Pages → Source 를 "GitHub Actions" 로 설정
name: PWA (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'store/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: d
        uses: actions/deploy-pages@v4
